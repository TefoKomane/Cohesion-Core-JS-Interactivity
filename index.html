<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cohesion Core Image Carousel</title>

    <link rel="stylesheet" href="style.css">

    <!-- bootstrap cdn -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

</head>

<body>

    <div class="container">

        <div class="carousel-container">

            <!-- images section -->
            <div class="carousel-slide">

                <div class="carousel-item">
                    <img src="images/Visual Studio.jfif" alt="VS Code">
                    <h3>VS Code</h3>
                    <p>Main coding editor used for web development.</p>
                </div>

                <div class="carousel-item">
                    <img src="images/github logo.jfif" alt="GitHub">
                    <h3>GitHub</h3>
                    <p>Used for saving and sharing code projects.</p>
                </div>

                <div class="carousel-item">
                    <img src="images/HTML.jfif" alt="HTML">
                    <h3>HTML</h3>
                    <p>Used for creating web pages.</p>
                </div>

                <div class="carousel-item">
                    <img src="images/React Native.jfif" alt="React Native">
                    <h3>React Native</h3>
                    <p>Used for building mobile applications.</p>
                </div>

            </div>

            <!-- buttons -->
            <button class="prevBtn">&#10094;</button>
            <button class="nextBtn">&#10095;</button>

            <!-- dots -->
            <div class="dots-container">

                <span class="dot active-dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    </div>

    <!-- javascript link -->
    <script src="solution.js"></script>

</body>
</html>
